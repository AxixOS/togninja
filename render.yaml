# Render Blueprint — TogNinja tenant instance
#
# One click provisions a complete, private instance: a Postgres database, the web service,
# and every secret it needs. The studio owns the Render account and the database; nothing
# here runs on infrastructure belonging to anybody else.
#
# ── What the studio does ────────────────────────────────────────────────────
#   1. Render → New + → "Blueprint" → connect GitHub → pick this repo → Apply.
#   2. Fill the handful of prompted values (marked `sync: false`).
#   3. Open the service URL. Setup starts on its own.
# Everything else — schema, secrets, database connection — happens without them.
#
# ── What this file got wrong before, and why it mattered ────────────────────
# Every one of these shipped, and each one breaks a tenant differently:
#
#   * it pointed at siparrott/studioOS-platform on branch portable-pg — the previous
#     repository and a branch the product no longer ships from, so an "Apply" deployed
#     something other than TogNinja;
#
#   * DEMO_MODE was "true", which enables POST /api/setup/reset-demo. That endpoint
#     TRUNCATEs clients, invoices, leads, galleries and landing pages, and it is not
#     authenticated, because on a demo instance it is not supposed to be. Every tenant
#     provisioned from this file shipped with a one-request CRM wipe;
#
#   * ENCRYPTION_KEY was absent entirely, while nine stored credentials are AES-GCM
#     encrypted from it. See server/lib/capabilities.ts encryptionHealthy(), which exists
#     precisely because an instance that cannot decrypt its own credentials is a confusing
#     thing to debug;
#
#   * DATABASE_URL was `sync: false`, so the studio had to go and create a database
#     somewhere else first — which is most of the friction this Blueprint exists to remove.
#     Render provisions Postgres, so it is provisioned here.

databases:
  # The studio's own database, in their own Render account.
  #
  # Postgres is all this product wants — it uses pg and Drizzle against a connection string
  # and nothing else. There is no Supabase auth, storage, realtime or RLS in the codebase, so
  # a Supabase project would be an extra account, an extra vendor and an extra OAuth
  # integration buying nothing. Render provisions it in the same click as the web service.
  #
  # The schema installs itself — but ONLY because AUTO_INIT_SCHEMA is set below.
  #
  # This comment used to say the boot DDL handled it. It does not. server/index.ts runs 32
  # CREATE TABLE IF NOT EXISTS statements and studio_configs is not among them, nor
  # crm_clients, admin_users or galleries — the core tables come from scripts/ensure-schema.mjs,
  # which the Dockerfile runs before npm start and which does nothing at all unless
  # AUTO_INIT_SCHEMA is truthy. Provisioned without it, a tenant boots against an empty
  # database and every query fails on a missing table.
  - name: togninja-studio-db
    databaseName: togninja
    plan: free          # upgrade to "basic" for backups and no 90-day expiry
    region: oregon

services:
  - type: web
    name: togninja-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon      # must match the database region, or every query crosses a continent
    plan: free          # free spins down when idle; "starter" for always-on
    repo: https://github.com/AxixOS/togninja
    # main, not product/main. `product` is the REMOTE name in this working copy — the pushes
    # are `git push product HEAD:main`, which sends to remote `product`, branch `main`. Writing
    # the remote/branch shorthand here made Render look for a branch literally called
    # "product/main", which does not exist, and refuse the Blueprint.
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      # ── Runtime ──────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production

      # FALSE, and it must stay false. See the note at the top: true exposes an
      # unauthenticated endpoint that empties the CRM.
      - key: DEMO_MODE
        value: "false"

      # Install the schema on first boot.
      #
      # scripts/ensure-schema.mjs is opt-in and refuses to act unless the database has ZERO
      # tables, so it cannot touch a populated one — which is precisely the condition a
      # freshly provisioned tenant is in and no other instance ever is. Without it the
      # container starts, every query fails on a missing table, and the studio sees a broken
      # product with no indication that a step was skipped.
      #
      # It is also best-effort: any failure logs loudly and exits 0, so it can never stop the
      # container from starting.
      - key: AUTO_INIT_SCHEMA
        value: "true"

      # Render injects PORT automatically and health-checks it — do not set it.

      # ── Database — wired from the block above, not typed by hand ─────────
      - key: DATABASE_URL
        fromDatabase:
          name: togninja-studio-db
          property: connectionString

      # ── Secrets Render generates, so nobody ever sees or handles them ────
      #
      # Both are load-bearing and NEITHER can be changed later without consequence: the
      # studio's stored integration credentials are encrypted from them, so rotating either
      # one silently makes every saved key unreadable.
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true

      # ── The studio's own AI account (optional) ───────────────────────────
      #
      # Deliberately theirs. The product's rule is that the platform pays to SHOW a feature
      # and the studio pays to USE it, so ongoing generation runs on their key and their
      # bill. The app boots without these and the AI features explain themselves as
      # unavailable rather than failing.
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      # ── File storage (optional at deploy, required before uploads) ───────
      #
      # Render has no object storage, so this is the one place a second vendor is
      # unavoidable. Leave blank and set it later in Technical Setup — the wizard now says
      # plainly that photographs cannot be stored until it is connected.
      #
      # For Backblaze use the S3-COMPATIBLE endpoint, s3.<region>.backblazeb2.com, not
      # api.backblazeb2.com. The latter is B2's native JSON API and the S3 client cannot
      # read its replies. See describeWrongApiEndpoint() in server/services/s3-storage.ts.
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_S3_ENDPOINT
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      # ── Identity (all optional) ──────────────────────────────────────────
      #
      # Every one of these is also asked for in the setup wizard and stored in the database,
      # which is where a studio can change them afterwards. They exist here only so a
      # pre-branded instance can be handed over ready-made; leave them unset and setup
      # collects them. PUBLIC_SITE_URL is the canonical origin used for SEO, sitemap and
      # canonical links.
      - key: PUBLIC_SITE_URL
        sync: false
      - key: BUSINESS_NAME
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: BUSINESS_PHONE
        sync: false
